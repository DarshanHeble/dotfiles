# Caelestia dynamic Material 3 palette for Tmux
# Auto-generated by ~/.config/tmux/sync-theme.py

set -g status-style "bg=default,fg=#dee8df"

# Session widget in top-left
set -g status-left-length 30
set -g status-left "#[fg=#1d4732,bg=#bfedd0,bold] #S #[bg=default] "

# Status widgets in top-right
set -g status-right-length 50
set -g status-right "#[fg=#fa746f]#{?pane_in_mode,COPY ,}#[fg=#bdf8fc]#{?client_prefix,PREFIX ,}#[fg=#d0e8d7]#{?window_zoomed_flag,ZOOM ,}#[fg=#6e7870]#h "

# Window tabs
set -g window-status-separator ""
set -g window-status-format "#[fg=#6e7870] #I:#W "
set -g window-status-current-format "#[fg=#bfedd0,bold] #I:#W "

# Borders
set -g pane-border-style "fg=#070c09"
set -g pane-active-border-style "fg=#bfedd0"

# Popups & command messages
set -g message-style "bg=#040705,fg=#bfedd0"
set -g message-command-style "bg=#040705,fg=#bfedd0"
set -g mode-style "bg=#bfedd0,fg=#1d4732"
setw -g clock-mode-colour "#bfedd0"
