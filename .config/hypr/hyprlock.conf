# Hyprlock configuration
# Frosted blurred background + styled split-colored clock and credentials

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +'<span foreground="##e8e4f0">%H</span>  <span foreground="##d06880">|</span>  <span foreground="##50c8d8">%M</span>'
    font_size = 90
    font_family = $font
    position = 0, 130
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +'%A, %B %-d' | tr 'a-z' 'A-Z'
    color = rgba(232, 228, 240, 0.85)
    font_size = 14
    font_family = $font
    position = 0, 55
    halign = center
    valign = center
}

# Username
label {
    monitor =
    text = cmd[update:0] echo $USER | tr 'a-z' 'A-Z'
    color = rgba(232, 228, 240, 1.0)
    font_size = 18
    font_family = $font
    position = 0, -45
    halign = center
    valign = center
}

# Password input field
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    rounding = 8
    inner_color = rgba(10, 12, 18, 0.7)
    outer_color = rgba(208, 104, 128, 0.9)
    check_color = rgba(80, 200, 216, 0.9)
    fail_color = rgba(255, 68, 68, 0.9)
    font_color = rgba(208, 104, 128, 1.0)
    font_family = $font
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    placeholder_text = <span foreground="##50c8d8cc">Enter Password</span>
    fail_text = <span foreground="##ff4444">Access Denied</span>
    position = 0, -105
    halign = center
    valign = center
}
